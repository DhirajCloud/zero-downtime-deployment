name: CD

on:
  push:
    branches:
      - main

jobs:
  validate-kubernetes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML validator
        run: pip install pyyaml

      - name: Validate Kubernetes manifests
        run: |
          python - <<'PY'
          import glob
          import sys
          import yaml

          files = glob.glob("kubernetes/*.yaml")

          if not files:
              print("No Kubernetes manifests found")
              sys.exit(1)

          for file in files:
              print(f"Validating {file}")

              with open(file) as f:
                  documents = list(yaml.safe_load_all(f))

              for document in documents:
                  if not isinstance(document, dict):
                      raise ValueError(f"Invalid YAML document: {file}")

                  for field in ("apiVersion", "kind", "metadata"):
                      if field not in document:
                          raise ValueError(
                              f"{file} missing required field: {field}"
                          )

          print("All Kubernetes manifests passed validation.")
          PY
