apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zero-downtime-api
  namespace: zero-downtime
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zero-downtime-api
  minReplicas: 3
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
